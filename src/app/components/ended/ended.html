<div class="game-grid" [class]="'game-grid size-' + cardSizeBacklog">
  @if (games; as gamesList) {
    @for (game of gamesList; track game.id; let i = $index) {
      <app-game-card
        [style.view-transition-name]="'card-' + game.id"
        class="stagger-item"
        [style.--i]="i"
        [game]="game"
        [size]="cardSizeBacklog"
      >
      </app-game-card>
    } @empty {
      <p>Empty list.</p>
    }
  }
</div>
